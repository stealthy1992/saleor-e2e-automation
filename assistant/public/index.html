<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tulip &amp; Teak support</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f3ee; color: #222; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    #chat-widget { background: #fff; border: 1px solid #d8d2c8; border-radius: 10px; display: flex; flex-direction: column; height: 70vh; min-height: 360px; }
    .chat-header { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #e6e1d8; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: #3b6e5a; color: #fff; }
    .msg.bot { align-self: flex-start; background: #efeae1; }
    .msg.pending, .msg.error { align-self: flex-start; color: #666; font-style: italic; }
    .msg.error { color: #a12; }
    .clauses { margin-top: 4px; font-size: 12px; color: #666; }
    .chat-form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e6e1d8; }
    .chat-form input { flex: 1; padding: 8px 10px; border: 1px solid #c9c2b6; border-radius: 6px; font: inherit; }
    .chat-form button { padding: 8px 16px; border: 0; border-radius: 6px; background: #3b6e5a; color: #fff; font: inherit; cursor: pointer; }
    .chat-form button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Tulip &amp; Teak</h1>
    <div id="chat-widget" data-test-id="chat-widget"></div>
  </main>
  <script src="/chat-widget.js"></script>
</body>
</html>
